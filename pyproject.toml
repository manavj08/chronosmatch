[build-system]
requires = ["setuptools>=61", "Cython>=3.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chronosmatch-matching-engine"
version = "1.0.0"
description = "Cython Price-Time Priority limit order book / matching engine"
requires-python = ">=3.9"

# Note: setup.py is kept alongside this file as the primary build entry
# point (`python setup.py build_ext --inplace`), which is the fast local
# iteration path used throughout development and by tests/ and
# benchmarks/. This file additionally makes `pip install .` work for
# consumers who want the compiled extension installed into a venv/site-
# packages rather than built in place.
