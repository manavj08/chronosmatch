<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ChronosMatch</title>

    <!-- Common CSS -->
    <link rel="stylesheet" href="css/common.css">

    <!-- Landing Page CSS -->
    <link rel="stylesheet" href="css/landing.css">

    <!-- Google Font -->
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap"
        rel="stylesheet">

</head>

<body>

    <!-- ========================= -->
    <!-- Landing Page -->
    <!-- ========================= -->

    <div class="overlay">

        <div class="container">

            <h1>CHRONOSMATCH</h1>

            <h2>Real-Time Trading Dashboard</h2>

            <p>
                Monitor live market data, analyze price trends,
                track real-time transactions and visualize trading
                performance with interactive charts.
            </p>

            <button id="dashboardBtn">
                🚀 Launch Dashboard
            </button>

        </div>

    </div>


    <!-- ========================= -->
    <!-- JavaScript -->
    <!-- ========================= -->

    <script>

        const dashboardBtn =
            document.getElementById("dashboardBtn");

        dashboardBtn.addEventListener("click", function () {

            window.location.href = "dashboard.html";

        });

    </script>

</body>

</html>
